version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: ./Containerfile_httpd-latest
    container_name: "web-sigacad2"
    ports:
      - "8080:80"
    volumes:
        - ../:/var/www:z
    depends_on:
      - php
    networks:
      - backend

  php:
    build:
      context: .
      dockerfile: ./Containerfile_php-7.4
    container_name: "php-sigacad2"
    volumes:
      - ../:/var/www:z
    networks:
      - backend
    environment:
      PHP_DATE_TIMEZONE: "America/Managua"
      PHP_DISPLAY_ERRORS: "1"
    depends_on:
      - pgsql
    expose:
      - "9000"

  pgsql:
    image: docker.io/postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    container_name: "pgsql-sigacad2"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local